[package]
name = "bitchess"
version = "0.1.0"
edition = "2021"

[features]
assertions = []

[dependencies]
once_cell = "1.21.4"
rand = "0.9.4"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
shakmaty = "0.26"
shakmaty-syzygy = "0.24"
